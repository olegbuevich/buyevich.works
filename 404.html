<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - buyevich.works</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #f6f4ef;
      --fg: #16150f;
      --muted: #6b675c;
      --line: #d9d5c9;
      --accent: #c2410c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111110;
        --fg: #edebe4;
        --muted: #8f8b80;
        --line: #2b2a26;
        --accent: #fb923c;
      }
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100svh;
    }

    header {
      padding: 20px clamp(16px, 5vw, 48px);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 13px;
    }

    .brand { color: var(--fg); letter-spacing: 0.02em; text-decoration: none; }
    .brand b { color: var(--accent); font-weight: inherit; }

    main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 32px clamp(16px, 5vw, 48px);
      max-width: 960px;
    }

    .status {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      margin: 0 0 24px;
    }

    h1 {
      margin: 0 0 32px;
      font-size: clamp(36px, 7vw, 72px);
      line-height: 1;
      letter-spacing: -0.04em;
      font-weight: 650;
      text-wrap: balance;
    }
    h1 span { display: block; }
    h1 span + span { color: var(--muted); }

    .cta {
      align-self: flex-start;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 14px;
      text-decoration: none;
      color: var(--bg);
      background: var(--fg);
      border-radius: 999px;
      padding: 12px 20px;
    }
    .cta:hover { background: var(--accent); }
    .cta:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">buyevich<b>.</b>works</a>
  </header>

  <main>
    <p class="status">404</p>

    <h1>
      <span lang="en">Page not found.</span>
      <span lang="pl">Nie znaleziono strony.</span>
    </h1>

    <a class="cta" href="/"><span aria-hidden="true">←</span> buyevich.works</a>
  </main>
</body>
</html>
